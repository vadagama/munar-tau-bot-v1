name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'tasks/**'
      - '.agents/**'
      - '**.md'
  push:
    branches: [main]

# Один активный прогон на ветку или main: новый пуш отменяет устаревший,
# чтобы не молотить параллельные прогоны ради промежуточных коммитов.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: "Node: lint / typecheck / test / build / secret-scan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: source/.nvmrc
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Тесты кабинета вынесены в параллельные шарды (job admin-tests).
      - run: npm run test -w core
      # Воркспейс assistant — новый прогон добавляется в CI явно (AGENTS.md).
      - run: npm run test -w assistant
      - run: npm run build -w admin
      - run: npm run build -w landing
      - name: Секреты в статической сборке (landing/dist)
        run: sh tools/scripts/check-build-secrets.sh landing/dist
      - name: Секреты в статической сборке (admin/dist)
        run: sh tools/scripts/check-build-secrets.sh admin/dist

  # Полностраничные jsdom-сценарии кабинета — самый долгий шаг CI (~6,5 мин
  # одним прогоном). Vitest шардит файлы детерминированно (алфавитными
  # чанками), три шарда идут параллельно на отдельных раннерах.
  admin-tests:
    name: "Admin tests: shard ${{ matrix.shard }}/3"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: source/.nvmrc
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run test -w admin -- --shard=${{ matrix.shard }}/3

  deno:
    name: "Deno: check / lint / test (функции)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno install
      - run: deno task check
      - run: deno task lint
      - run: deno task test

  # Интеграционные тесты не запускаются в CI (решение пользователя 23.10.2026):
  # облачный прогон слишком затратен. Тесты сохраняются в Git и запускаются
  # локально только по отдельному явному запросу (AGENTS.md, «Команды»).

  # Task 8: деплой из CI — только push в main, после зелёного CI.
  # Каждый шаг выполняется при наличии своих секретов; если секреты не
  # настроены — джоба завершается успехом с предупреждением (деплой ещё
  # не настроен, R3). Секреты задаются в настройках репозитория GitHub.
  deploy:
    name: "Deploy (условный): Supabase DB / functions / Cloudflare Pages"
    needs: [node, admin-tests, deno]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_FUNCTION_REGION: ${{ vars.VITE_SUPABASE_FUNCTION_REGION }}
      # Адрес Worker ассистента (ADR-021): публичный, попадает в статику кабинета.
      VITE_ASSISTANT_WS_URL: ${{ vars.VITE_ASSISTANT_WS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: source/.nvmrc
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Supabase — миграции БД (supabase db push)
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != ''
        run: npx --yes supabase@^2 db push --project-ref "$SUPABASE_PROJECT_ID"

      - name: "Supabase — деплой функций (--use-api: docker-бандлер не резолвит core через symlink)"
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != ''
        run: |
          npx --yes supabase@^2 functions deploy api --use-api --import-map deno.json --project-ref "$SUPABASE_PROJECT_ID"
          npx --yes supabase@^2 functions deploy bot-webhook --use-api --import-map deno.json --project-ref "$SUPABASE_PROJECT_ID"
          npx --yes supabase@^2 functions deploy jobs --use-api --import-map deno.json --project-ref "$SUPABASE_PROJECT_ID"
          echo "::notice::Функции задеплоены. Секреты функций (TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, X_JOBS_SECRET) задаются отдельно: supabase secrets set (R3)."

      - name: Сборка кабинета для целевой среды
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CF_PAGES_PROJECT != ''
        run: |
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          npm ci
          npm run build -w admin
          sh tools/scripts/check-build-secrets.sh admin/dist

      - name: Cloudflare Pages — публикация статики кабинета
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CF_PAGES_PROJECT != ''
        run: npx --yes wrangler@^4 pages deploy admin/dist --project-name "$CF_PAGES_PROJECT" --branch main

      - name: Деплой не настроен — предупреждение
        if: env.SUPABASE_ACCESS_TOKEN == '' && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::Секреты деплоя не настроены (SUPABASE_*, CLOUDFLARE_*) — публикация пропущена. Настройка: см. AGENTS.md, раздел «Команды» (R3)."
