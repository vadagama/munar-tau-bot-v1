name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    name: "Node: lint / typecheck / test / build / secret-scan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: source/.nvmrc
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w admin
      - name: Секреты в статической сборке (admin/dist)
        run: sh tools/scripts/check-build-secrets.sh admin/dist

  deno:
    name: "Deno: check / lint / test (функции)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno install
      - run: deno task check
      - run: deno task lint
      - run: deno task test

  # ── ВРЕМЕННО ОТКЛЮЧЕНО (2026-10-17) ─────────────────────────────────────
  # Джоба снята с прогона на время разработки: долгий прогон и дедлоки
  # при параллельных запусках против dev-БД (40P01). Ручной запуск —
  # `RUN_INTEGRATION_TESTS=1 npm run test:integration` из source/ при настроенном TEST_DATABASE_URL
  # (см. AGENTS.md, раздел «Команды»). Вернуть — раскомментировать блок ниже.
  #
  # Интеграционные тесты против dev-БД Supabase (TEST_DATABASE_URL из секретов;
  # тесты применяют миграции и очищают данные — только dev-проект, HLD §20).
  # Без секрета джоба зелёная с предупреждением (по паттерну deploy).
  # integration:
  #   concurrency:
  #     group: munar-tau-dev-integration
  #     cancel-in-progress: false
  #   name: "Node: интеграционные тесты (dev-БД Supabase)"
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: source
  #   env:
  #     RUN_INTEGRATION_TESTS: "1"
  #     TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version-file: source/.nvmrc
  #         cache: npm
  #         cache-dependency-path: source/package-lock.json
  #     - run: npm ci
  #     - name: Интеграционные тесты (TEST_DATABASE_URL настроен)
  #       if: env.TEST_DATABASE_URL != ''
  #       run: npm run test:integration
  #     - name: TEST_DATABASE_URL не настроен — предупреждение
  #       if: env.TEST_DATABASE_URL == ''
  #       run: echo "::warning::TEST_DATABASE_URL не настроен — интеграционные тесты пропущены. Задайте секрет с URI session-pooler dev-проекта (см. AGENTS.md, раздел «Команды»)."

  # Task 8: деплой из CI — только push в main, после зелёного CI.
  # Каждый шаг выполняется при наличии своих секретов; если секреты не
  # настроены — джоба завершается успехом с предупреждением (деплой ещё
  # не настроен, R3). Секреты задаются в настройках репозитория GitHub.
  deploy:
    name: "Deploy (условный): Supabase DB / functions / Cloudflare Pages"
    needs: [node, deno]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_FUNCTION_REGION: ${{ vars.VITE_SUPABASE_FUNCTION_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: source/.nvmrc

      - name: Supabase — миграции БД (supabase db push)
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != ''
        run: npx --yes supabase@^2 db push --project-ref "$SUPABASE_PROJECT_ID"

      - name: "Supabase — деплой функций (--use-api: docker-бандлер не резолвит core через symlink)"
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != ''
        run: |
          npx --yes supabase@^2 functions deploy api --use-api --import-map deno.json --project-ref "$SUPABASE_PROJECT_ID"
          npx --yes supabase@^2 functions deploy bot-webhook --use-api --import-map deno.json --project-ref "$SUPABASE_PROJECT_ID"
          npx --yes supabase@^2 functions deploy jobs --use-api --import-map deno.json --project-ref "$SUPABASE_PROJECT_ID"
          echo "::notice::Функции задеплоены. Секреты функций (TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, X_JOBS_SECRET) задаются отдельно: supabase secrets set (R3)."

      - name: Сборка кабинета для целевой среды
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CF_PAGES_PROJECT != ''
        run: |
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          npm ci
          npm run build -w admin
          sh tools/scripts/check-build-secrets.sh admin/dist

      - name: Cloudflare Pages — публикация статики кабинета
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CF_PAGES_PROJECT != ''
        run: npx --yes wrangler@^4 pages deploy admin/dist --project-name "$CF_PAGES_PROJECT" --branch main

      - name: Деплой не настроен — предупреждение
        if: env.SUPABASE_ACCESS_TOKEN == '' && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::Секреты деплоя не настроены (SUPABASE_*, CLOUDFLARE_*) — публикация пропущена. Настройка: см. AGENTS.md, раздел «Команды» (R3)."
